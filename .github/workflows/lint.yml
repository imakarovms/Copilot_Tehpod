name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: 'pip'  <-- УДАЛИТЕ ЭТУ СТРОКУ ИЛИ ЗАКОММЕНТИРУЙТЕ
      
      # Жестко фиксируем версию, чтобы совпадала с локальной
      - run: pip install black==25.1.0 
      - run: black --check .